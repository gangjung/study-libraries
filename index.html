<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>공부 도서관</title>
    <meta name="theme-color" content="#0a0d13" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="공부 도서관" />
    <style>
      :root {
        --bg: #0a0d13;
        --bar: #121722;
        --line: #232b3a;
        --text: #e7ecf5;
        --muted: #8792a6;
        --accent: #6aa8ff;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
        overflow: hidden;
      }
      body {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        padding-top: env(safe-area-inset-top);
      }
      #frames { position: relative; flex: 1; min-height: 0; }
      #frames iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: var(--bg);
        display: none;
      }
      #frames iframe.on { display: block; }
      #loading {
        position: absolute; inset: 0;
        display: grid; place-items: center;
        color: var(--muted); font-size: 14px;
        pointer-events: none;
      }
      nav {
        display: flex;
        background: var(--bar);
        border-top: 1px solid var(--line);
        padding-bottom: env(safe-area-inset-bottom);
        flex-shrink: 0;
      }
      nav button {
        flex: 1;
        background: none;
        border: 0;
        color: var(--muted);
        font: inherit;
        font-size: 12px;
        padding: 8px 4px 9px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        border-top: 2px solid transparent;
        margin-top: -1px;
      }
      nav button { min-width: 0; }
      nav button > span:last-child { max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      nav button .ico { font-size: 20px; line-height: 1.1; }
      nav button[aria-selected='true'] { color: var(--text); border-top-color: var(--accent); }
      /* 탭 7개: 좁은 폰에서는 글자를 줄여 한 줄에 맞춘다 */
      @media (max-width: 480px) {
        nav button { font-size: 10.5px; letter-spacing: -0.04em; padding: 7px 1px 8px; }
        nav button .ico { font-size: 19px; }
      }
      nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
      /* 넓은 화면에서는 탭바를 위로 */
      @media (min-width: 900px) {
        body { flex-direction: column-reverse; }
        nav { border-top: 0; border-bottom: 1px solid var(--line); padding-bottom: 0; justify-content: center; }
        nav button { flex: 0 1 150px; flex-direction: row; justify-content: center; gap: 8px; font-size: 14px; padding: 10px; border-top: 0; border-bottom: 2px solid transparent; margin: 0 0 -1px; }
        nav button .ico { font-size: 18px; }
        nav button[aria-selected='true'] { border-bottom-color: var(--accent); }
      }
    </style>
  </head>
  <body>
    <div id="frames"><div id="loading">불러오는 중…</div></div>
    <nav role="tablist" aria-label="라이브러리 선택"></nav>
    <script src="./hub.js"></script>
  </body>
</html>
